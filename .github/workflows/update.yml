name: Update rotation data

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 5 minutes, Mon–Fri, 08:00–21:55 UTC = pre-market 04:00 ET through the 16:00 ET close (EDT & EST)
    - cron: "*/5 8-21 * * 1-5"
    # Final refresh after the close and one weekend refresh
    - cron: "20 22 * * 1-5"
    - cron: "0 13 * * 6"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data/rotation.json (Yahoo · ETFIQ · TradingView · Bybit)
        run: python scripts/build_data.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
